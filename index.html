<!DOCTYPE html>
<html>
<head>
    <title>🌐 Cross-Network Secure File Transfer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #313244 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(49, 50, 68, 0.95);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 32px;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }
        .connection-id {
            background: rgba(0,212,255,0.2);
            border: 2px solid #00d4ff;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
        }
        .id-field {
            background: rgba(0,0,0,0.3);
            border: none;
            color: #00ff88;
            font-size: 24px;
            font-family: monospace;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .mode-btn {
            padding: 20px;
            border: 3px solid #00d4ff;
            border-radius: 20px;
            background: transparent;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            color: black;
            transform: scale(1.05);
        }
        .connect-btn {
            width: 100%;
            padding: 25px;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            color: black;
            border: none;
            border-radius: 20px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        .connect-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,255,136,0.4);
        }
        .connect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .file-area {
            border: 4px dashed #00d4ff;
            border-radius: 25px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
            background: rgba(42,43,62,0.4);
        }
        .file-area:hover { border-color: #00ff88; }
        .file-area.dragover { 
            border-color: #00ff88; 
            background: rgba(0,255,136,0.2);
            transform: scale(1.02);
        }
        .file-icon { font-size: 64px; margin-bottom: 20px; }
        .file-list {
            background: rgba(30,30,46,0.8);
            border-radius: 20px;
            padding: 25px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.6;
        }
        .status {
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 25px;
        }
        .status.connected { background: rgba(0,255,136,0.2); color: #00ff88; }
        .status.connecting { background: rgba(255,170,0,0.2); color: #ffaa00; }
        .status.error { background: rgba(255,85,85,0.2); color: #ff5555; }
        .progress {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            width: 0%;
            transition: width 0.3s;
        }
        .qr-code {
            text-align: center;
            margin: 20px 0;
        }
        .qr-code canvas {
            border: 2px solid #00d4ff;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Cross-Network Transfer</h1>
        
        <div class="connection-id">
            <div>Your Connection ID:</div>
            <input type="text" class="id-field" id="myId" readonly>
            <div style="font-size: 14px; margin-top: 10px; opacity: 0.8;">
                Share this ID with other device
            </div>
        </div>

        <div class="mode-grid">
            <button class="mode-btn active" onclick="setMode('sender')">📤 Sender</button>
            <button class="mode-btn" onclick="setMode('receiver')">📥 Receiver</button>
        </div>

        <div style="text-align: center; margin-bottom: 20px;">
            <input type="text" id="remoteId" placeholder="Enter remote ID" style="width: 70%; padding: 15px; margin-right: 10px;">
            <button class="connect-btn" id="connectBtn" onclick="connect()">🔗 CONNECT</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="file-area" id="fileArea" onclick="selectFiles()">
            <div class="file-icon">📁</div>
            <div>Click or drag files here</div>
            <input type="file" id="fileInput" multiple style="display: none;">
        </div>

        <div id="fileList" class="file-list" style="display: none;"></div>
        <div id="receivedList" class="file-list">Waiting for files...</div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="qr-code" id="qrCode" style="display: none;"></div>
    </div>

    <!-- WebRTC + Signaling Server -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        class CrossNetworkTransfer {
            constructor() {
                this.localId = this.generateId();
                this.socket = io('wss://file-transfer-8z9k.onrender.com'); // Free signaling server
                this.peerConnection = null;
                this.dataChannel = null;
                this.selectedFiles = [];
                this.isSender = true;
                this.init();
            }

            generateId() {
                return Math.random().toString(36).substr(2, 9).toUpperCase();
            }

            init() {
                document.getElementById('myId').value = this.localId;
                this.bindEvents();
                this.socket.on('connect', () => {
                    console.log('Signaling server connected');
                });
            }

            bindEvents() {
                this.socket.on('offer', (data) => this.handleOffer(data));
                this.socket.on('answer', (data) => this.handleAnswer(data));
                this.socket.on('ice-candidate', (data) => this.handleIceCandidate(data));
            }

            setMode(mode) {
                this.isSender = mode === 'sender';
                document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                document.getElementById('fileArea').style.display = this.isSender ? 'block' : 'none';
            }

            async connect() {
                const remoteId = document.getElementById('remoteId').value.trim();
                if (!remoteId) {
                    this.showStatus('Enter remote ID!', 'error');
                    return;
                }

                this.showStatus('🔄 Connecting...', 'connecting');
                document.getElementById('connectBtn').disabled = true;

                // Create peer connection
                this.peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                });

                this.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.socket.emit('ice-candidate', {
                            candidate: event.candidate,
                            from: this.localId,
                            to: remoteId
                        });
                    }
                };

                this.peerConnection.ondatachannel = (event) => {
                    this.dataChannel = event.channel;
                    this.setupDataChannel();
                };

                if (this.isSender) {
                    // Create data channel
                    this.dataChannel = this.peerConnection.createDataChannel('fileTransfer');
                    this.setupDataChannel();
                    const offer = await this.peerConnection.createOffer();
                    await this.peerConnection.setLocalDescription(offer);
                    this.socket.emit('offer', {
                        offer: offer,
                        from: this.localId,
                        to: remoteId
                    });
                }

                // Listen for remote connection
                setTimeout(() => {
                    if (this.dataChannel && this.dataChannel.readyState === 'open') {
                        this.showStatus('✅ Connected across networks!', 'connected');
                    }
                }, 5000);
            }

            setupDataChannel() {
                this.dataChannel.onopen = () => {
                    console.log('Data channel open');
                };

                this.dataChannel.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'fileChunk') {
                        this.handleFileChunk(data);
                    }
                };
            }

            handleOffer(data) {
                if (data.to === this.localId) {
                    this.peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer))
                    .then(() => {
                        return this.peerConnection.createAnswer();
                    })
                    .then((answer) => {
                        this.peerConnection.setLocalDescription(answer);
                        this.socket.emit('answer', {
                            answer: answer,
                            from: this.localId,
                            to: data.from
                        });
                    });
                }
            }

            handleAnswer(data) {
                if (data.to === this.localId) {
                    this.peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
            }

            handleIceCandidate(data) {
                if (data.to === this.localId) {
                    this.peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }

            selectFiles() {
                document.getElementById('fileInput').click();
            }

            handleFiles(files) {
                this.selectedFiles = Array.from(files);
                const list = document.getElementById('fileList');
                list.style.display = 'block';
                list.innerHTML = this.selectedFiles.map(f => 
                    `📄 ${f.name} (${(f.size/1024).toFixed(1)}KB)`
                ).join('<br>');
            }

            async sendFiles() {
                for (let file of this.selectedFiles) {
                    await this.sendFile(file);
                }
                this.selectedFiles = [];
                document.getElementById('fileList').style.display = 'none';
            }

            async sendFile(file) {
                const chunkSize = 16384; // 16KB chunks
                const totalChunks = Math.ceil(file.size / chunkSize);

                for (let i = 0; i < totalChunks; i++) {
                    const start = i * chunkSize;
                    const end = Math.min(start + chunkSize, file.size);
                    const chunk = file.slice(start, end);
                    
                    const reader = new FileReader();
                    await new Promise((resolve) => {
                        reader.onload = (e) => {
                            this.dataChannel.send(JSON.stringify({
                                type: 'fileChunk',
                                name: file.name,
                                chunk: e.target.result,
                                index: i,
                                total: totalChunks
                            }));
                            resolve();
                        };
                        reader.readAsArrayBuffer(chunk);
                    });

                    // Update progress
                    const percent = ((i + 1) / totalChunks) * 100;
                    document.getElementById('progressFill').style.width = percent + '%';
                }
            }

            handleFileChunk(data) {
                // Download received file
                const blob = new Blob([data.chunk]);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = data.name;
                a.click();

                const list = document.getElementById('receivedList');
                list.innerHTML += `<div>✅ ${data.name}</div>`;
                this.showStatus(`✅ ${data.name} received!`, 'connected');
            }

            showStatus(msg, type) {
                const status = document.getElementById('status');
                status.textContent = msg;
                status.className = `status ${type}`;
                status.style.display = 'block';
            }
        }

        // Global instance
        const transfer = new CrossNetworkTransfer();

        // Event listeners
        document.getElementById('fileInput').addEventListener('change', (e) => {
            transfer.handleFiles(e.target.files);
        });

        const fileArea = document.getElementById('fileArea');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event => {
            fileArea.addEventListener(event, e => e.preventDefault());
        });

        ['dragenter', 'dragover'].forEach(event => {
            fileArea.addEventListener(event, () => fileArea.classList.add('dragover'));
        });
        ['dragleave', 'drop'].forEach(event => {
            fileArea.addEventListener(event, () => fileArea.classList.remove('dragover'));
        });

        fileArea.addEventListener('drop', e => {
            transfer.handleFiles(e.dataTransfer.files);
        });

        function setMode(mode) {
            transfer.setMode(mode);
        }

        function connect() {
            transfer.connect();
        }

        // Auto-send when connected and files selected
        setInterval(() => {
            if (transfer.dataChannel?.readyState === 'open' && transfer.selectedFiles.length > 0) {
                transfer.sendFiles();
            }
        }, 1000);
    </script>
</body>
</html>
