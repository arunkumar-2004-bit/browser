<!DOCTYPE html>
<html>
<head>
    <title>🔒 Secure File Transfer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: white;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: rgba(26,27,38,0.95);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }
        .mode-toggle {
            display: flex;
            background: rgba(42,43,62,0.8);
            border-radius: 15px;
            padding: 4px;
            margin-bottom: 25px;
        }
        .mode-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: rgba(255,255,255,0.7);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .mode-btn.active {
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            color: black;
        }
        .ip-input {
            position: relative;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 18px 20px 18px 50px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0,212,255,0.3);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }
        .ip-label {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #00d4ff;
            font-weight: bold;
        }
        .connect-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, #00ff88, #00d4ff);
            color: black;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
            transition: all 0.3s;
        }
        .connect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,255,136,0.4);
        }
        .connect-btn:disabled {opacity: 0.5; cursor: not-allowed;}
        .file-area {
            background: rgba(42,43,62,0.6);
            border: 3px dashed rgba(0,212,255,0.5);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .file-area:hover {border-color: #00d4ff; background: rgba(0,212,255,0.1);}
        .file-area.dragover {border-color: #00ff88; background: rgba(0,255,136,0.1);}
        .file-icon {font-size: 48px; margin-bottom: 15px;}
        .file-list, .received-list {
            background: rgba(30,30,46,0.8);
            border-radius: 15px;
            padding: 20px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.5;
        }
        .status {
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .status.connected {background: rgba(0,255,136,0.2); color: #00ff88;}
        .status.connecting {background: rgba(255,170,0,0.2); color: #ffaa00;}
        .status.error {background: rgba(255,85,85,0.2); color: #ff5555;}
        .progress {
            width: 100%;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            width: 0%;
            transition: width 0.3s;
        }
        @media (max-width: 500px) {
            .container {margin: 10px; padding: 20px;}
            h1 {font-size: 24px;}
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 Secure Transfer</h1>
        
        <div class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('server')">🖥️ Server</button>
            <button class="mode-btn" onclick="setMode('client')">📱 Client</button>
        </div>
        
        <div class="ip-input">
            <div class="ip-label" id="ipLabel">IP:</div>
            <input type="text" id="serverIP" placeholder="192.168.1.100:5001" disabled>
        </div>
        
        <div id="status" class="status" style="display:none;"></div>
        
        <button class="connect-btn" id="connectBtn" onclick="toggleConnection()">
            🚀 START SERVER / CONNECT
        </button>
        
        <div class="file-area" onclick="document.getElementById('fileInput').click()">
            <div class="file-icon">📁</div>
            <div>Click or drag files here</div>
            <input type="file" id="fileInput" multiple style="display:none;">
        </div>
        
        <div id="fileList" class="file-list" style="display:none;"></div>
        <div id="receivedList" class="received-list">Waiting for files...</div>
        
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        let socket = null;
        let isServerMode = true;
        let selectedFiles = [];
        let isConnected = false;
        
        // Drag & Drop
        const fileArea = document.querySelector('.file-area');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileArea.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        ['dragenter', 'dragover'].forEach(eventName => {
            fileArea.addEventListener(eventName, highlight, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            fileArea.addEventListener(eventName, unhighlight, false);
        });
        
        function highlight(e) {
            fileArea.classList.add('dragover');
        }
        function unhighlight(e) {
            fileArea.classList.remove('dragover');
        }
        
        fileArea.addEventListener('drop', handleDrop, false);
        
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }
        
        document.getElementById('fileInput').addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        function handleFiles(files) {
            selectedFiles = Array.from(files);
            const list = document.getElementById('fileList');
            list.style.display = 'block';
            list.innerHTML = selectedFiles.map(f => 
                `📄 ${f.name} <span>(${(f.size/1024).toFixed(1)}KB)</span>`
            ).join('<br>');
        }
        
        function setMode(mode) {
            isServerMode = mode === 'server';
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const ipInput = document.getElementById('serverIP');
            document.getElementById('ipLabel').textContent = isServerMode ? 'My IP:' : 'Server:';
            
            if (isServerMode) {
                ipInput.disabled = true;
                ipInput.value = '';
            } else {
                ipInput.disabled = false;
                ipInput.placeholder = '192.168.1.100:5001';
            }
        }
        
        async function getLocalIP() {
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                document.getElementById('serverIP').placeholder = `${data.ip}:5001`;
            } catch {}
        }
        
        function toggleConnection() {
            if (!isConnected) {
                connect();
            } else {
                disconnect();
            }
        }
        
        function connect() {
            if (!isServerMode) {
                const ip = document.getElementById('serverIP').value;
                if (!ip) {
                    showStatus('Enter server IP!', 'error');
                    return;
                }
                // Connect to Python server (TCP socket would need WebSocket bridge)
                showStatus('📱 Connect your phone to PC server!', 'connected');
            } else {
                showStatus('🖥️ Server ready! Share IP with phone', 'connected');
            }
            document.getElementById('connectBtn').textContent = '🔄 CONNECTED';
            document.getElementById('connectBtn').disabled = true;
            isConnected = true;
        }
        
        function disconnect() {
            if (socket) socket.close();
            isConnected = false;
            document.getElementById('connectBtn').textContent = '🚀 START SERVER / CONNECT';
            document.getElementById('connectBtn').disabled = false;
            showStatus('Disconnected', 'error');
        }
        
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }
        
        getLocalIP();
    </script>
</body>
</html>
